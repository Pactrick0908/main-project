<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset=".42" stop-color="#18BFFF"/>
      <stop offset=".72" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#D000FF"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset=".5" stop-color="#36B9FF"/>
      <stop offset="1" stop-color="#D000FF"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset=".55" stop-color="#F5F7FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="86" fill="#050A13"/>
  <rect x="18" y="18" width="988" height="988" rx="70" fill="none" stroke="#101827" stroke-width="4"/>

  <!-- Neon rounded border -->
  <rect x="76" y="76" width="872" height="872" rx="76" fill="none" stroke="url(#neon)" stroke-width="11" filter="url(#glow)"/>
  <rect x="76" y="76" width="872" height="872" rx="76" fill="none" stroke="url(#neon)" stroke-width="5"/>

  <!-- Orbit accents -->
  <path d="M150 553 C210 470 330 440 445 447 C585 455 731 493 872 427" fill="none" stroke="url(#neon)" stroke-width="15" stroke-linecap="round" opacity=".92"/>
  <path d="M140 579 C205 705 377 718 580 654 C690 620 782 556 884 471" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" opacity=".55"/>

  <!-- Pixel speed marks -->
  <g fill="url(#neon)" filter="url(#glow)">
    <rect x="160" y="320" width="78" height="16" transform="rotate(-12 160 320)"/>
    <rect x="178" y="366" width="94" height="17" transform="rotate(-12 178 366)"/>
    <rect x="220" y="423" width="34" height="17" transform="rotate(-12 220 423)"/>
  </g>

  <!-- Pixel sparkles -->
  <g fill="url(#neon)" filter="url(#glow)">
    <path d="M285 182h18v18h18v18h-18v36h-18v-36h-18v-18h18z"/>
    <path d="M820 478h16v16h16v16h-16v38h-16v-38h-16v-16h16z"/>
  </g>

  <!-- Ticket shadow -->
  <g transform="translate(512 365) rotate(-12) translate(-512 -365)" opacity=".35" filter="url(#softglow)">
    <path d="M296 267 H754 V298 H777 V329 H794 V391 H777 V422 H794 V483 H777 V514 H754 V545 H296 V514 H273 V483 H256 V422 H273 V391 H256 V329 H273 V298 H296 Z" fill="#7B4DFF"/>
  </g>

  <!-- Main pixel ticket -->
  <g transform="translate(512 365) rotate(-12) translate(-512 -365)" filter="url(#glow)">
    <path d="M296 267 H754 V298 H777 V329 H794 V391 H777 V422 H794 V483 H777 V514 H754 V545 H296 V514 H273 V483 H256 V422 H273 V391 H256 V329 H273 V298 H296 Z"
          fill="#070D18" stroke="url(#ticket)" stroke-width="11" stroke-linejoin="miter"/>
    <!-- perforation -->
    <path d="M694 300 V326 M694 344 V370 M694 388 V414 M694 432 V458 M694 476 V502"
          stroke="url(#ticket)" stroke-width="9" stroke-linecap="square"/>
    <!-- Solana mark -->
    <g transform="translate(430 330)">
      <path d="M0 0 H175 L145 30 H-30 Z" fill="#00F5D4" transform="skewX(-18)"/>
      <path d="M0 63 H175 L145 93 H-30 Z" fill="#4AA8FF" transform="skewX(-18)"/>
      <path d="M0 126 H175 L145 156 H-30 Z" fill="#A43CFF" transform="skewX(-18)"/>
    </g>
  </g>

  <!-- 8BITS wordmark -->
  <g font-family="'Press Start 2P','Courier New',monospace" font-weight="900" text-anchor="middle" filter="url(#glow)">
    <text x="512" y="704" font-size="128" letter-spacing="3" fill="url(#type)">8BITS</text>
  </g>

  <!-- TICKET wordmark -->
  <g font-family="'Press Start 2P','Courier New',monospace" font-weight="900" text-anchor="middle">
    <text x="512" y="808" font-size="48" letter-spacing="14" fill="url(#neon)">TICKET</text>
    <rect x="192" y="777" width="96" height="8" rx="2" fill="#18BFFF"/>
    <rect x="736" y="777" width="96" height="8" rx="2" fill="#A43CFF"/>
  </g>

  <!-- tiny pixel details -->
  <g fill="#00F5D4" opacity=".9">
    <rect x="238" y="248" width="8" height="8"/><rect x="250" y="236" width="8" height="8"/>
    <rect x="784" y="606" width="8" height="8"/><rect x="796" y="594" width="8" height="8"/>
  </g>
</svg>